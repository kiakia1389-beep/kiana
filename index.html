<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>برنامهٔ درسی هوشمند</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b2f7a">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face{font-family:'Vazirmatn';font-weight:400 600;src:local('Vazirmatn'),local('Vazirmatn Regular'),url('fonts/Vazirmatn-Regular.woff2') format('woff2')}
@font-face{font-family:'Vazirmatn';font-weight:700 800;src:local('Vazirmatn Bold'),url('fonts/Vazirmatn-Bold.woff2') format('woff2')}
@font-face{font-family:'Noto Nastaliq Urdu';font-weight:400 700;src:local('Noto Nastaliq Urdu'),url('fonts/NotoNastaliqUrdu.ttf') format('truetype')}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap">
<style>
/* Layout: right-hand nav on desktop, bottom tab bar on phone; six pages share one tokenized card language */
:root{color-scheme:light}
:root{
  --bg:#eef2f8;--surface:#ffffff;--surface2:#f6f8fc;--fg:#14213d;--muted:#5b6578;--line:#dde3ee;--accent:#2f5bd9;--accent-fg:#ffffff;--done:#1f9d6b;--warn:#d98a1e;--bad:#d64545;
  --hero-a:#1b2f7a;--hero-b:#0e7f9c;--hero-c:#27b58a;
  --c-phys:#2f5bd9;--c-chem:#d9531e;--c-bio:#1f9d6b;--c-math:#7b4fd1;--c-geo:#a8741a;--c-eng:#0e8fa8;--c-ar:#c13c78;--c-fa:#6f8f1d;--c-rel:#4a6fa5;--c-his:#9a6b2f;--c-env:#3f9a8a;--c-pe:#e0872b;--c-ink:#c2336b;--c-none:#8a93a5;
  --font:'Vazirmatn',Tahoma,'Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1222;--surface:#151d33;--surface2:#1b2440;--fg:#e8ecf6;--muted:#9aa5bd;--line:#27324d;--accent:#7f9cff;--accent-fg:#0c1222;--done:#48c796;--warn:#f0b04a;--bad:#ff7b7b;
  --hero-a:#16286a;--hero-b:#0b6a84;--hero-c:#1f9c78;
  --c-phys:#7f9cff;--c-chem:#ff8a5c;--c-bio:#48c796;--c-math:#b79bff;--c-geo:#e0b25a;--c-eng:#4cc9e0;--c-ar:#ff86b4;--c-fa:#b4d457;--c-rel:#8fb0e6;--c-his:#d9a56a;--c-env:#6fd1bf;--c-pe:#ffb066;--c-ink:#ff7aa8;--c-none:#8e98ad;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1222;--surface:#151d33;--surface2:#1b2440;--fg:#e8ecf6;--muted:#9aa5bd;--line:#27324d;--accent:#7f9cff;--accent-fg:#0c1222;--done:#48c796;--warn:#f0b04a;--bad:#ff7b7b;
  --hero-a:#16286a;--hero-b:#0b6a84;--hero-c:#1f9c78;
  --c-phys:#7f9cff;--c-chem:#ff8a5c;--c-bio:#48c796;--c-math:#b79bff;--c-geo:#e0b25a;--c-eng:#4cc9e0;--c-ar:#ff86b4;--c-fa:#b4d457;--c-rel:#8fb0e6;--c-his:#d9a56a;--c-env:#6fd1bf;--c-pe:#ffb066;--c-ink:#ff7aa8;--c-none:#8e98ad;color-scheme:dark}
*{box-sizing:border-box}
html{direction:rtl}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.75;margin:0;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:14px 96px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
ol,ul{list-style:none;margin:0;padding:0}
.app{max-width:1100px;margin:0 auto;display:grid;gap:16px}
.bar-top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--hero-a),var(--hero-c));display:grid;place-items:center;color:#fff}
.sync{font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--done)}
.nav{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px))}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.7rem;color:var(--muted);padding:4px 2px;border-radius:10px;cursor:pointer;min-width:0}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.nav svg{width:22px;height:22px}
.shell{display:grid;gap:16px;min-width:0}
@media (min-width:900px){
  body{padding-bottom:40px}
  .shell{grid-template-columns:200px 1fr;align-items:start}
  .nav{position:sticky;top:14px;inset:auto;flex-direction:column;justify-content:flex-start;border:1px solid var(--line);border-radius:18px;padding:10px;gap:4px;order:0}
  .nav button{flex:none;flex-direction:row;gap:10px;font-size:.92rem;padding:10px 12px;justify-content:flex-start}
  .nav button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 13%,transparent)}
}
main{min-width:0;display:grid;gap:14px;align-content:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-width:0}
.card h2{font-size:1.1rem;font-weight:800;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card h3{font-size:.98rem;font-weight:700;margin-bottom:6px}
.muted{color:var(--muted)}.small{font-size:.82rem}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.gs{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
.hero{border-radius:22px;padding:20px;color:#fff;background:linear-gradient(135deg,var(--hero-a),var(--hero-b) 55%,var(--hero-c));display:grid;gap:14px}
.hero .who{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av{overflow:hidden;width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:1.7rem;font-weight:800;flex:none;border:3px solid rgba(255,255,255,.7);box-shadow:0 4px 16px rgba(0,0,0,.25)}
.hero h1{font-family:'Noto Nastaliq Urdu','Vazirmatn',Tahoma,serif;font-size:2.4rem;font-weight:700;line-height:2;white-space:nowrap;overflow-wrap:normal;padding-block:.15em;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.hero .line{opacity:.95;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:2px 12px;font-size:.8rem}
.btn{border:0;background:var(--accent);color:var(--accent-fg);padding:8px 15px;border-radius:11px;cursor:pointer;font-weight:700;font-size:.88rem}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn.sm{padding:4px 11px;font-size:.8rem}
.btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line))}
.hero .btn{background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.4)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible+.chk{outline:3px solid var(--accent);outline-offset:2px}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:12px;align-items:center;border-radius:14px;padding:10px 14px;border:1px solid;background:var(--surface)}
.alert b{font-weight:800}
.alert.a0{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.alert.a1{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
.alert.a2{border-color:var(--c-eng);background:color-mix(in srgb,var(--c-eng) 12%,var(--surface))}
.alert.a3{border-color:var(--line)}
.alert .big{font-size:1.5rem;font-weight:800;min-width:2.2em;text-align:center;font-variant-numeric:tabular-nums}
.alert.ok{border-color:color-mix(in srgb,var(--done) 45%,var(--line));background:color-mix(in srgb,var(--done) 9%,var(--surface))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;justify-items:center;gap:4px;text-align:center}
.tile .lab{font-weight:700;font-size:.88rem}
.tile .sub{font-size:.76rem;color:var(--muted)}
.ring{width:92px;height:92px}
.ring text{font-family:var(--font);font-weight:800;fill:var(--fg)}
.pill{display:inline-block;font-size:.74rem;font-weight:700;line-height:1.55;padding:0 9px;border-radius:99px;color:var(--sc,var(--c-none));background:color-mix(in srgb,var(--sc,var(--c-none)) 14%,transparent);border:1px solid color-mix(in srgb,var(--sc,var(--c-none)) 35%,transparent)}
.rows{display:grid;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:14px;border-inline-start:5px solid var(--sc,var(--c-none));display:flex;align-items:flex-start;gap:6px;min-width:0}
.row.minor{border-inline-start-color:var(--line);background:var(--surface2)}
.row.k-class{border-color:color-mix(in srgb,var(--sc) 55%,var(--line));border-inline-start-color:var(--sc)}
.row label{flex:1;display:flex;align-items:flex-start;gap:11px;padding:10px 12px;cursor:pointer;min-width:0}
.row input{position:absolute;opacity:0;pointer-events:none}
.chk{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);margin-top:2px;display:grid;place-items:center;background:var(--surface)}
.chk::after{content:"";width:12px;height:7px;border:solid var(--accent-fg);border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
input:checked+.chk{background:var(--done);border-color:var(--done)}
input:checked+.chk::after{opacity:1}
.tm{flex:none;display:flex;flex-direction:column;align-items:center;min-width:3.5em;font-variant-numeric:tabular-nums;line-height:1.35;margin-top:1px}
.tm b{font-weight:700}.tm span{font-size:.78rem;color:var(--muted)}
.row.k-class .tm b{color:var(--sc)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.d{overflow-wrap:anywhere}
.du{flex:none;text-align:center;font-size:.7rem;color:var(--muted);line-height:1.3;min-width:3em;margin-top:2px}
.du b{display:block;font-size:.92rem;color:var(--fg);font-variant-numeric:tabular-nums}
.row:has(input:checked){opacity:.62}
.row:has(input:checked) .d{text-decoration:line-through;text-decoration-color:var(--muted)}
.ib{flex:none;border:0;background:none;color:var(--muted);cursor:pointer;padding:10px 10px;border-radius:10px;align-self:flex-start}
.ib:hover{color:var(--accent)}
.ib svg{width:18px;height:18px;display:block}
.note{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:12px;padding:9px 14px;font-size:.88rem}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--done);border-radius:6px}
.pl{display:flex;align-items:center;gap:12px}
.pl .n{font-size:.83rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 1px 8px;scrollbar-width:thin}
.seg button{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 13px;cursor:pointer;font-size:.86rem;line-height:1.5}
.seg button small{display:block;color:var(--muted);font-size:.7rem}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.seg button[aria-pressed="true"] small{color:inherit;opacity:.8}
.seg button.today{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.wsel{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wsel select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 10px;min-width:0}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:8px;text-align:right;cursor:pointer;border-top:5px solid var(--sc);min-width:0;width:100%}
.scard b{font-size:1.05rem}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 14px;display:grid;gap:7px;cursor:pointer;text-align:right;width:100%;min-width:0}
.wk.cur{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.wk .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.badge{font-size:.72rem;font-weight:700;border-radius:8px;padding:0 8px;background:color-mix(in srgb,var(--c-ink) 16%,transparent);color:var(--c-ink);border:1px solid color-mix(in srgb,var(--c-ink) 35%,transparent)}
.badge.n{background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted);border-color:var(--line)}
details.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 14px}
details.day>summary{cursor:pointer;padding:11px 0;display:flex;align-items:center;gap:12px;font-weight:700;list-style:none}
details.day>summary::-webkit-details-marker{display:none}
details.day[open]>summary{border-bottom:1px dashed var(--line);margin-bottom:10px}
details.day .rows{padding-bottom:12px}
.list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);min-width:0}
.list li:last-child{border:0}
.list .t{flex:1;min-width:0;overflow-wrap:anywhere}
.list li.done .t{text-decoration:line-through;color:var(--muted)}
.empty{padding:14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;font-size:.88rem}
.hb{display:grid;grid-template-columns:7.5em 1fr auto;gap:10px;align-items:center;margin-bottom:8px;font-size:.86rem}
.hb .t{height:11px;background:var(--line);border-radius:7px;overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:7px;background:var(--sc,var(--accent))}
.hb .v{font-variant-numeric:tabular-nums;color:var(--muted);min-width:3.2em;text-align:left}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font);font-size:11px;fill:var(--muted)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.chart .bar-r{fill:var(--accent)}
textarea,input[type=text],input[type=time],select.f,input.f{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:8px 11px;min-width:0}
textarea{min-height:92px;resize:vertical}
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,12,24,.55);display:grid;place-items:center;padding:14px}
.modal{background:var(--surface);color:var(--fg);border-radius:20px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:18px;display:grid;gap:12px;border:1px solid var(--line)}
.modal h2{font-size:1.1rem;font-weight:800}
.fl{display:grid;gap:3px;font-size:.85rem;font-weight:700}
.fl.r{grid-template-columns:1fr 1fr;gap:10px}.fl.r>div{display:grid;gap:3px}
.fl span.h{font-weight:400;color:var(--muted);font-size:.76rem}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start}
.radio{display:flex;gap:14px;flex-wrap:wrap;font-weight:500}
.toast{position:fixed;inset-inline:0;bottom:calc(80px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:60;pointer-events:none}
.toast div{background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:12px;font-size:.88rem;max-width:90vw}
.sw{display:inline-flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px}
.sw button{border:0;background:none;padding:4px 12px;border-radius:9px;cursor:pointer;font-size:.84rem;color:var(--muted)}
.sw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:700}
.tabrow{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
@media (max-width:560px){.hb{grid-template-columns:6em 1fr auto}.du{display:none}.hero h1{font-size:1.75rem}.av{width:88px;height:88px}.fl.r{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="bar-top"><div class="brand"><span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M7 9.5V15c0 1.5 2.2 3 5 3s5-1.5 5-3V9.5"/></svg></span>برنامهٔ درسی هوشمند</div><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end"><div class="acts" id="bk" hidden><button class="btn ghost sm" type="button" id="bkx">ذخیرهٔ پشتیبان</button><button class="btn ghost sm" type="button" id="bki">بازیابی پشتیبان</button><input type="file" id="bkf" accept="application/json,.json" hidden></div><div class="sync" id="sync"><i></i><span>در حال آماده‌سازی</span></div></div></div>
  <div class="shell"><nav class="nav" id="nav" aria-label="منوی اصلی"></nav><main id="view"></main></div>
</div>
<div id="layer"></div><div class="toast" id="toast"></div>
<script>

async function flush(){
  if(!db||flushing)return;flushing=true;
  try{var paths=Object.keys(dirty);
    for(var i=0;i<paths.length;i++){var p=paths[i];delete dirty[p];
      try{await db.doc(p).set(JSON.parse(JSON.stringify(docData(p))))}
      catch(e){dirty[p]=1;if(!warned){warned=true;toast('ذخیرهٔ مشترک انجام نشد؛ فعلاً فقط روی این دستگاه ذخیره می‌شود.')}}}
  }finally{flushing=false;if(Object.keys(dirty).length&&!warned){flushT=setTimeout(flush,1500)}}}
function setSync(on){if(OFFLINE){var e0=document.getElementById('sync');e0.className='sync on';e0.lastChild.textContent='نسخهٔ آفلاین · ذخیره روی همین کامپیوتر';return}
  var el=document.getElementById('sync');el.className='sync'+(on?' on':'');el.lastChild.textContent=on?'ذخیرهٔ مشترک فعال':'ذخیره فقط روی این دستگاه'}
function toast(t){var el=document.getElementById('toast');el.innerHTML='<div>'+esc(t)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(function(){el.innerHTML=''},3500)}

var pendingRender=false;
function remoteChanged(){saveLocal();if(busy()){pendingRender=true}else render()}
async function initDb(){
  try{if(!window.claude||!window.claude.use){setSync(false);return}
    db=await window.claude.use('db')}catch(e){db=null}
  if(!db){setSync(false);return}
  setSync(true);var firstApp=true;
  db.collection('app').onSnapshot(function(snap){
    var ids={};snap.docs.forEach(function(d){ids[d.id]=1;if(d.metadata.hasPendingWrites||dirty['app/'+d.id])return;var v=d.data()||{};
      if(d.id==='profile')S.profile=v;
      else if(d.id==='config'){S.config=Object.assign({weekCount:17,startISO:'2026-11-21',edits:{},hidden:{},extra:[]},v);S.config.edits=S.config.edits||{};S.config.hidden=S.config.hidden||{};S.config.extra=S.config.extra||[]}
      else if(d.id==='grades')S.grades=v.items||[]});
    if(firstApp&&!snap.metadata.fromCache){firstApp=false;
      if(!ids.config&&hadLocal){['app/profile','app/config','app/grades'].forEach(function(p){dirty[p]=1});Object.keys(S.weeks).forEach(function(k){dirty['weeks/w'+k]=1});flush()}}
    remoteChanged()},function(){setSync(false)});
  db.collection('weeks').onSnapshot(function(snap){
    snap.docs.forEach(function(d){if(d.metadata.hasPendingWrites||dirty['weeks/'+d.id])return;var k=+d.id.slice(1);if(k)S.weeks[k]=d.data()||{}});
    remoteChanged()},function(){});
}

/* ---------- dates ---------- */
function startD(){var p=S.config.startISO.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function dayDate(k,i){var s=startD();return new Date(s.getFullYear(),s.getMonth(),s.getDate()+7*(k-1)+i)}
function today0(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function diff(a,b){return Math.round((a-b)/864e5)}
var JF=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{day:'numeric',month:'long'});
var JFY=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric'});
function jd(d){try{return JF.format(d)}catch(e){return fa(d.getMonth()+1)+'/'+fa(d.getDate())}}
function jdy(d){try{return JFY.format(d)}catch(e){return jd(d)}}
function weekRange(k){return jd(dayDate(k,0))+' تا '+jd(dayDate(k,6))}
function curWeek(){var n=Math.floor(diff(today0(),startD())/7)+1;return Math.max(1,Math.min(S.config.weekCount,n))}
function todayIdx(){var d=diff(today0(),startD());if(d<0||d>=7*S.config.weekCount)return null;return d%7}
function todayWeekReal(){var d=diff(today0(),startD());return d<0||d>=7*S.config.weekCount?null:Math.floor(d/7)+1}
function isMaz(k){var w=W(k);return w.maz==null?(k%2===0):!!w.maz}

/* ---------- rows ---------- */
function mn(t){var p=t.split(':');return +p[0]*60+ +p[1]}
function dur(s,e){var d=(mn(e)-mn(s)+1440)%1440;return d}
function rowsFor(k,dayId){
  var day=TPL.days.filter(function(d){return d.id===dayId})[0],w=W(k),c=S.config,maz=isMaz(k),out=[];
  day.rows.forEach(function(r,i){
    if(r.mode!=='both'&&r.mode!==(maz?'maz':'no'))return;
    if(r.t==='row'&&(c.hidden[r.id]||w.hidden[r.id]))return;
    var x=Object.assign({},r,c.edits[r.id]||{},w.edits[r.id]||{});x.base=true;x.ix=i;out.push(x)});
  (c.extra||[]).filter(function(e){return e.day===dayId}).forEach(function(e){out.push(Object.assign({t:'row',mode:'both',kind:'study',scope:'all',base:false},e))});
  (w.extra||[]).filter(function(e){return e.day===dayId}).forEach(function(e){out.push(Object.assign({t:'row',mode:'both',kind:'study',scope:'week',base:false},e))});
  out.forEach(function(r,i){r.k=r.t==='note'?-1:mn(r.s);r.o=i});
  out.sort(function(a,b){return a.k-b.k||a.o-b.o});return out}
function acad(r){return r.t==='row'&&(r.kind==='study'||r.kind==='class')}
function tickOf(k,id){return !!W(k).ticks[id]}
function dayProg(k,dayId,onlyAcad){var rs=rowsFor(k,dayId).filter(function(r){return r.t==='row'&&(!onlyAcad||acad(r))});
  var done=rs.filter(function(r){return tickOf(k,r.id)}).length;return {done:done,total:rs.length,pc:rs.length?Math.round(done*100/rs.length):0}}
function weekProg(k,onlyAcad){var d=0,t=0,m=0,pm=0;DAYIDS.forEach(function(id){rowsFor(k,id).forEach(function(r){if(r.t!=='row'||(onlyAcad&&!acad(r)))return;t++;pm+=dur(r.s,r.e);if(tickOf(k,r.id)){d++;m+=dur(r.s,r.e)}})});
  return {done:d,total:t,pc:t?Math.round(d*100/t):0,mins:m,planned:pm}}
function allAcadWeeks(upTo){var r=[];for(var k=1;k<=upTo;k++)r.push(k);return r}
function subjStats(s,upTo){var d=0,t=0,m=0,pm=0;allAcadWeeks(upTo).forEach(function(k){DAYIDS.forEach(function(id){rowsFor(k,id).forEach(function(r){if(!acad(r)||r.subj!==s)return;t++;pm+=dur(r.s,r.e);if(tickOf(k,r.id)){d++;m+=dur(r.s,r.e)}})})});
  return {done:d,total:t,pc:t?Math.round(d*100/t):0,mins:m,planned:pm}}
function hrs(m){var h=Math.floor(m/60),r=m%60;return h?fa(h)+' ساعت'+(r?' و '+fa(r)+' دقیقه':''):fa(r)+' دقیقه'}

/* ---------- exams, homework, grades ---------- */
function examsAll(){var out=[],t0=today0();
  for(var k=1;k<=S.config.weekCount;k++){var w=W(k);
    (w.exams||[]).forEach(function(e){var d=dayDate(k,e.day);out.push({id:e.id,k:k,day:e.day,date:d,du:diff(d,t0),subj:e.subj,time:e.time,topic:e.topic,auto:false})});
    if(isMaz(k)){var d2=dayDate(k,6);out.push({id:'maz'+k,k:k,day:6,date:d2,du:diff(d2,t0),subj:'maz',time:'',topic:'',auto:true})}}
  out.sort(function(a,b){return a.date-b.date});return out}
function examTitle(e){return e.subj==='maz'&&e.auto?'آزمون جامع ماز':(e.subj==='all'?'':'امتحان ')+NAME(e.subj)+(e.topic?' · '+e.topic:'')}
function hwAll(){var out=[],t0=today0();for(var k=1;k<=S.config.weekCount;k++){(W(k).hw||[]).forEach(function(h){var d=dayDate(k,h.day);out.push({id:h.id,k:k,day:h.day,date:d,du:diff(d,t0),subj:h.subj,text:h.text,done:!!h.done})})}out.sort(function(a,b){return a.date-b.date});return out}
function pctOf(g){return g.max>0?Math.max(0,Math.min(100,g.score*100/g.max)):0}
function gsorted(){return S.grades.slice().sort(function(a,b){return (a.wk*10+a.day)-(b.wk*10+b.day)})}
function avgOf(list){return list.length?list.reduce(function(s,g){return s+pctOf(g)},0)/list.length:null}
function p0(x){return fa(Math.round(x))+'٪'}

function lineChart(pts,opt){
  if(!pts.length)return '<div class="empty">هنوز دادهٔ کافی نیست.</div>';
  var Wd=640,H=230,L=40,R=14,T=14,B=34,iw=Wd-L-R,ih=H-T-B,g='',n=pts.length;
  [0,25,50,75,100].forEach(function(v){var y=T+ih-ih*v/100;g+='<line class="gl" x1="'+L+'" x2="'+(Wd-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+fa(v)+'</text>'});
  var xs=pts.map(function(p,i){return L+(n===1?iw/2:iw*i/(n-1))}),ys=pts.map(function(p){return T+ih-ih*p.y/100});
  var path=xs.map(function(x,i){return (i?'L':'M')+x.toFixed(1)+' '+ys[i].toFixed(1)}).join(' ');
  var step=Math.ceil(n/8),dots='',lab='';
  pts.forEach(function(p,i){dots+='<circle class="pt" cx="'+xs[i].toFixed(1)+'" cy="'+ys[i].toFixed(1)+'" r="4.5"><title>'+esc(p.t)+'</title></circle>';
    if(i%step===0||i===n-1)lab+='<text x="'+xs[i].toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle">'+esc(p.x)+'</text>'});
  return '<svg class="chart" viewBox="0 0 '+Wd+' '+H+'" role="img" aria-label="'+esc(opt.label)+'">'+g+'<path class="ln" d="'+path+'"/>'+dots+lab+'</svg>'}

  [0,50,100].forEach(function(v){var y=T+ih-ih*v/100;g+='<line class="gl" x1="'+L+'" x2="'+(Wd-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+fa(v)+'</text>'});

  ui.modal=true;var L=document.getElementById('layer');
  L.innerHTML='<div class="ov" id="ov"><form class="modal" id="mf" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><h2>'+esc(title)+'</h2>'+body+'<div class="acts"><button class="btn" type="submit">ذخیره</button><button class="btn ghost" type="button" data-m="close">انصراف</button>'+(extra||'')+'</div></form></div>';
  var f=document.getElementById('mf');f.addEventListener('submit',function(e){e.preventDefault();var fd=new FormData(f),o={};fd.forEach(function(v,k){o[k]=v});if(onSave(o)!==false)closeModal()});
  var first=f.querySelector('input,select,textarea');if(first)first.focus();return f}
function closeModal(){ui.modal=false;document.getElementById('layer').innerHTML='';if(pendingRender){pendingRender=false}render()}
function uid(p){return p+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36)}
function fld(label,input,hint){return '<label class="fl">'+label+input+(hint?'<span class="h">'+hint+'</span>':'')+'</label>'}

function mProfile(){var P=prof(),photo=P.photo||'';
  openModal('مشخصات دانش‌آموز','<div class="fl">عکس<div style="display:flex;gap:12px;align-items:center"><span class="av" style="background:var(--surface2);border-color:var(--line);color:var(--fg)" id="pv">'+(photo?'<img src="'+photo+'" alt="">':'؟')+'</span><input type="file" id="pf" accept="image/*" class="f"></div></div>'+fld('نام و نام خانوادگی','<input class="f" type="text" name="name" value="'+esc(P.name||'')+'">')
   +'<div class="fl r"><div>'+fld('پایه','<input class="f" type="text" name="grade" value="'+esc(P.grade||'')+'">')+'</div><div>'+fld('رشتهٔ تحصیلی','<input class="f" type="text" name="field" value="'+esc(P.field||'')+'">')+'</div></div>'
   +fld('دبیرستان','<input class="f" type="text" name="school" value="'+esc(P.school||'')+'">')
   +'<div class="fl r"><div>'+fld('شهر','<input class="f" type="text" name="city" value="'+esc(P.city||'')+'">')+'</div><div>'+fld('کلاس','<input class="f" type="text" name="class" value="'+esc(P['class']||'')+'">')+'</div></div>'
   +fld('هدف میانگین نمرات (درصد)','<input class="f" type="text" inputmode="decimal" name="goal" value="'+esc(P.goal||'')+'">','مثلاً ۹۰؛ در داشبورد نمایش داده می‌شود')
   ,function(o){S.profile={photo:photo,name:o.name.trim(),grade:o.grade.trim(),field:o.field.trim(),school:o.school.trim(),city:o.city.trim(),'class':o['class'].trim(),goal:norm(o.goal)};mark('app/profile')});
  var pf=document.getElementById('pf');
  if(pf)pf.addEventListener('change',function(){var fl=pf.files&&pf.files[0];if(!fl)return;var img=new Image(),u=URL.createObjectURL(fl);img.onload=function(){var m=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=240;c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,240,240);photo=c.toDataURL('image/jpeg',.82);document.getElementById('pv').innerHTML='<img src="'+photo+'" alt="">';URL.revokeObjectURL(u)};img.src=u})}
function mRow(k,dayId,rowId){
  var rs=rowsFor(k,dayId),r=rowId?rs.filter(function(x){return x.id===rowId})[0]:null,isNew=!r;
  r=r||{s:'16:00',e:'17:00',subj:'',text:'',kind:'study',base:false};
  var kinds=Object.keys(KINDS).map(function(x){return '<option value="'+x+'"'+(x===r.kind?' selected':'')+'>'+KINDS[x]+'</option>'}).join('');
  var body='<div class="fl r"><div>'+fld('شروع','<input class="f" type="time" name="s" required value="'+r.s+'">')+'</div><div>'+fld('پایان','<input class="f" type="time" name="e" required value="'+r.e+'">')+'</div></div>'
   +'<div class="fl r"><div>'+fld('درس','<select class="f" name="subj">'+subjOpts(r.subj,false,true)+'<option value="fix"'+(r.subj==='fix'?' selected':'')+'>رفع اشکال</option><option value="plan"'+(r.subj==='plan'?' selected':'')+'>برنامه‌ریزی</option></select>')+'</div><div>'+fld('نوع فعالیت','<select class="f" name="kind">'+kinds+'</select>')+'</div></div>'
   +fld('شرح فعالیت','<textarea class="f" name="text" required>'+esc(r.text)+'</textarea>');
  var scope='<div class="fl">اعمال برای<div class="radio"><label><input type="radio" name="scope" value="week" checked> فقط هفتهٔ '+fa(k)+'</label><label><input type="radio" name="scope" value="all"> همهٔ هفته‌ها</label></div></div>';
  if(!isNew&&!r.base)scope='';
  var extra='';if(!isNew)extra='<button class="btn danger" type="button" data-m="delrow">حذف</button>'+(r.base&&(S.config.edits[rowId]||W(k).edits[rowId])?'<button class="btn ghost" type="button" data-m="restore">بازگشت به پایه</button>':'');
  var f=openModal(isNew?'افزودن فعالیت':'ویرایش فعالیت',body+scope,function(o){
    var vals={s:o.s,e:o.e,subj:o.subj,kind:o.kind,text:o.text.trim()};
    if(isNew){var x=Object.assign({id:uid('x'),day:dayId,t:'row',mode:'both'},vals);if(o.scope==='all'){S.config.extra.push(x);mark('app/config')}else{W(k).extra.push(x);touchW(k)}}
    else if(!r.base){var arr=r.scope==='all'?S.config.extra:W(k).extra,t=arr.filter(function(y){return y.id===r.id})[0];if(t)Object.assign(t,vals);r.scope==='all'?mark('app/config'):touchW(k)}
    else{if(o.scope==='all'){S.config.edits[rowId]=vals;mark('app/config')}else{W(k).edits[rowId]=vals;touchW(k)}}
  },extra);
  f.addEventListener('click',function(e){var m=e.target.getAttribute&&e.target.getAttribute('data-m');
    if(m==='delrow'){if(!r.base){var arr=r.scope==='all'?S.config.extra:W(k).extra,ix=arr.findIndex(function(y){return y.id===r.id});if(ix>=0)arr.splice(ix,1);r.scope==='all'?mark('app/config'):touchW(k)}
      else{var sc=f.querySelector('input[name=scope]:checked');if(sc&&sc.value==='all'){S.config.hidden[rowId]=1;mark('app/config')}else{W(k).hidden[rowId]=1;touchW(k)}}closeModal()}
    if(m==='restore'){delete S.config.edits[rowId];delete W(k).edits[rowId];mark('app/config');touchW(k);closeModal()}})}
function mExam(k,subj){
  k=k||ui.wk||curWeek();var ti=todayIdx(),w0=todayWeekReal()===k&&ti!=null?ti:0;
  openModal('افزودن امتحان',fld('هفته','<select class="f" name="wk">'+weekOpts(k)+'</select>')
   +'<div class="fl r"><div>'+fld('روز','<select class="f" name="day">'+daySel(w0)+'</select>')+'</div><div>'+fld('درس','<select class="f" name="subj">'+subjOpts(subj||'bio',false,false)+'</select>')+'</div></div>'
   +'<div class="fl r"><div>'+fld('ساعت (اختیاری)','<input class="f" type="time" name="time">')+'</div><div>'+fld('مبحث (اختیاری)','<input class="f" type="text" name="topic" placeholder="مثلاً فصل ۳">')+'</div></div>'
   ,function(o){var wk=+o.wk;W(wk).exams.push({id:uid('e'),subj:o.subj,day:+o.day,time:o.time||'',topic:o.topic.trim()});touchW(wk)})}
function mHw(k,subj){
  k=k||ui.wk||curWeek();
  openModal('افزودن تکلیف',fld('هفته','<select class="f" name="wk">'+weekOpts(k)+'</select>')
   +'<div class="fl r"><div>'+fld('درس','<select class="f" name="subj">'+subjOpts(subj||'phys',false,false)+'</select>')+'</div><div>'+fld('موعد (روز)','<select class="f" name="day">'+daySel(0)+'</select>')+'</div></div>'
   +fld('شرح تکلیف','<textarea class="f" name="text" required placeholder="مثلاً ۲۰ تست فصل ۲ و حل تمرین‌های صفحهٔ ۴۵"></textarea>')
   ,function(o){var wk=+o.wk;W(wk).hw.push({id:uid('h'),subj:o.subj,day:+o.day,text:o.text.trim(),done:false});touchW(wk)})}
function mGrade(subj){
  var k=todayWeekReal()||curWeek(),ti=todayIdx()||0;
  openModal('ثبت نمره',
   '<div class="fl r"><div>'+fld('درس','<select class="f" name="subj">'+subjOpts(subj||'bio',true,false)+'</select>')+'</div><div>'+fld('نوع','<select class="f" name="type">'+Object.keys(GTYPES).map(function(t){return '<option value="'+t+'">'+GTYPES[t]+'</option>'}).join('')+'</select>')+'</div></div>'
   +fld('عنوان (اختیاری)','<input class="f" type="text" name="title" placeholder="مثلاً امتحان فصل ۱">')
   +'<div class="fl r"><div>'+fld('نمره','<input class="f" type="text" inputmode="decimal" name="score" required placeholder="۱۷٫۵">')+'</div><div>'+fld('بیشترین نمره','<input class="f" type="text" inputmode="decimal" name="max" required value="۲۰">','برای ماز می‌تواند ۱۰۰ باشد')+'</div></div>'
   +'<div class="fl r"><div>'+fld('هفته','<select class="f" name="wk">'+weekOpts(k)+'</select>')+'</div><div>'+fld('روز','<select class="f" name="day">'+daySel(ti)+'</select>')+'</div></div>'
   ,function(o){var sc=parseFloat(norm(o.score)),mx=parseFloat(norm(o.max));if(!(mx>0)||isNaN(sc)||sc<0||sc>mx){toast('نمره باید عددی بین صفر و بیشترین نمره باشد.');return false}
    S.grades.push({id:uid('g'),subj:o.subj,type:o.type,title:o.title.trim(),score:sc,max:mx,wk:+o.wk,day:+o.day});mark('app/grades')})}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  if(e.target.id==='ov'){closeModal();return}
  var m=e.target.closest('[data-m="close"]');if(m){closeModal();return}
  var t=e.target.closest('[data-act]');if(!t)return;var a=t.dataset.act,k=+t.dataset.wk||ui.wk||curWeek();
  if(a==='editprofile')mProfile();
  else if(a==='addexam')mExam(+t.dataset.wk||null,t.dataset.s);
  else if(a==='addhw')mHw(+t.dataset.wk||null,t.dataset.s);
  else if(a==='addgrade')mGrade(t.dataset.s);
  else if(a==='editrow')mRow(+t.dataset.wk,t.dataset.day,t.dataset.id);
  else if(a==='addrow')mRow(+t.dataset.wk,t.dataset.day,null);
  else if(a==='day'){ui.day=+t.dataset.d;render()}
  else if(a==='gotoday'){ui.wk=+t.dataset.wk;ui.day=+t.dataset.d;go('days')}
  else if(a==='wkprev'){ui.wk=Math.max(1,(ui.wk||curWeek())-1);render()}
  else if(a==='wknext'){ui.wk=Math.min(S.config.weekCount,(ui.wk||curWeek())+1);render()}
  else if(a==='subj'){ui.sub=t.dataset.s;if(ui.page!=='subjects')ui.page='subjects';render();window.scrollTo(0,0)}
  else if(a==='openweek'){ui.openWeek=+t.dataset.wk;ui.wk=ui.openWeek;render();window.scrollTo(0,0)}
  else if(a==='backweeks'){ui.openWeek=null;render()}
  else if(a==='setmaz'){W(k).maz=t.dataset.v==='1';touchW(k);render()}
  else if(a==='delexam'){var w=W(k);w.exams=w.exams.filter(function(x){return x.id!==t.dataset.id});touchW(k);render()}
  else if(a==='delhw'){var w2=W(k);w2.hw=w2.hw.filter(function(x){return x.id!==t.dataset.id});touchW(k);render()}
  else if(a==='delgrade'){S.grades=S.grades.filter(function(x){return x.id!==t.dataset.id});mark('app/grades');render()}
  else if(a==='addweek'){S.config.weekCount++;mark('app/config');toast('یک هفتهٔ جدید اضافه شد.');render()}
  else if(a==='resetweek'){var w3=W(k);w3.edits={};w3.hidden={};w3.extra=[];touchW(k);toast('برنامهٔ این هفته به حالت پایه برگشت.');render()}
});
document.addEventListener('change',function(e){var t=e.target;
  if(t.dataset.tick){var w=W(+t.dataset.wk);w.ticks[t.dataset.id]=t.checked?1:0;touchW(+t.dataset.wk);render()}
  else if(t.dataset.hwdone){var h=(W(+t.dataset.wk).hw||[]).filter(function(x){return x.id===t.dataset.id})[0];if(h){h.done=t.checked;touchW(+t.dataset.wk);render()}}
  else if(t.dataset.sel==='wk'){ui.wk=+t.value;if(ui.page==='weeks')ui.openWeek=ui.wk;render()}});
var nT=null;
document.addEventListener('input',function(e){var t=e.target;if(t.id==='notes'){var k=+t.dataset.wk;W(k).notes=t.value;clearTimeout(nT);nT=setTimeout(function(){touchW(k)},600)}});
document.addEventListener('focusout',function(){if(pendingRender&&!ui.modal){setTimeout(function(){if(!busy()){pendingRender=false;render()}},50)}});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(PAGEFN[h]&&h!==ui.page){ui.page=h;if(h!=='weeks')ui.openWeek=null;render()}});
var h0=location.hash.slice(1);if(PAGEFN[h0])ui.page=h0;
ui.wk=curWeek();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){})}
setSync(false);render();
if(OFFLINE){document.getElementById('bk').hidden=false;
  document.getElementById('bkx').addEventListener('click',function(){var a=document.createElement('a'),d=new Date(),n='kiana-plan-backup-'+d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+'.json';
    a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download=n;document.body.appendChild(a);a.click();a.remove();toast('فایل پشتیبان ذخیره شد.')});
  var bf=document.getElementById('bkf');document.getElementById('bki').addEventListener('click',function(){bf.click()});
  bf.addEventListener('change',function(){var f=bf.files&&bf.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o||!o.config)throw 0;S=o;S.profile=S.profile||{};S.weeks=S.weeks||{};S.grades=S.grades||[];saveLocal();render();toast('پشتیبان بازیابی شد.')}catch(e){toast('این فایل پشتیبان معتبر نیست.')}};r.readAsText(f)})}
else initDb();
})();
</script>
